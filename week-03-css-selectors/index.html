<!DOCTYPE html>
<html lang="en">

<head> 
   <title>College Football List</title>
   <link rel="stylesheet" href="style.css">
</head>

<!-- List of the top 8 college football programs of all time:
Oklahoma Sooners
Miami Hurricanes
Michigan Wolverines
Nebraska Cornhuskers
Alabama Crimson Tide
Ohio State Buckeyes
Texas Longhorns
Notre Dame Fighting Irish 
-->
<body>
   <!-- title to let everyone know what this website is about -->
   <h1>Top College Football Programs of All Time</h1>

   <!-- begin the list of the football programs in order -->
   <ol>
      <!-- number 1 should be crimson (same as number 5) -->
      <li class="crimson">
         Oklahoma Sooners
      </li>

      <!-- number 2 should be a greenish color -->
      <li class="greenish">
         Miami Hurricanes
      </li>

      <!-- number 3 should be maize (go blue!) -->
      <li class="maize">
         Michigan Wolverines
      </li>

      <!-- number 4 should be red -->
      <li class="red">
         Nebraska Cornhuskers
      </li>

      <!-- number 5 should be crimson -->
      <li class="crimson">
         Alabama Crimson Tide
      </li>

      <!-- number 6 should be red -->
      <li class="red">
         Ohio State Buckeyes
      </li>

      <!-- number 7 should be burnt orange -->
      <li class="burnt-orange">
         Texas Longhorns
      </li>

      <!-- number 8 should be the same greenish color as number 2 -->
      <li class="greenish">
         Notre Dame Fighting Irish
      </li>
   </ol>

   <!-- show 2 buttons to allow users to answer the question below -->
   <p>Do you agree with this list?</p>
   
   <!-- yes button should have id because there should only be 1 yes button -->
   <button id="yesButton">
      Yes
   </button>

   <!-- no button should have id because there should only be 1 no button -->
   <button id="noButton">
      No
   </button>
</body>
</html>
